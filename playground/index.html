<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Send Redis commands to a local FlashDB server." />
    <title>FlashDB playground</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>FlashDB</h1>
        <p class="hint">Tap a past command to fill the box again.</p>
      </div>
      <p id="status" class="status">Connecting…</p>
    </header>
    <main id="log" aria-live="polite"></main>
    <form id="composer">
      <label class="sr-only" for="command">Command</label>
      <input
        id="command"
        name="command"
        type="text"
        enterkeyhint="send"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        autocomplete="off"
        placeholder="PING"
      />
      <button type="submit">Send</button>
    </form>
    <script src="/app.js"></script>
  </body>
</html>
