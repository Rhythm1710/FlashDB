[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# The image sets FLASHDB_TRUST_PROXY=1 so the per-client cap uses X-Real-IP
# (then the right-most X-Forwarded-For) instead of Railway's edge address.
# Leave the variable set if the image env is overridden.
