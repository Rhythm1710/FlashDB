[package]
name = "flashdb"
version = "0.1.0"
edition = "2021"
description = "A Redis-compatible in-memory database written from scratch in Rust."
license = "MIT"
repository = "https://github.com/Rhythm1710/FlashDB"

[[bin]]
name = "flashdb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.59"                                   # error handling
bytes = "1.3.0"                                     # buffer management
thiserror = "1.0.32"                                # error handling
tokio = { version = "1.23.0", features = ["full"] } # async networking
